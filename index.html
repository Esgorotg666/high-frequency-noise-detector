<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>High Frequency Noise Detector</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #0a0a0a;
    color: #fff;
    text-align: center;
    min-height: 100vh;
  }
  h1 { font-size: 1.5rem; margin: 8px 0; }
  .controls {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 12px;
    margin: 8px 0;
  }
  label { display: block; margin: 6px 0 2px; font-size: 0.9rem; }
  input[type="range"] { width: 100%; margin: 4px 0; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.1rem;
    font-weight: 600;
    background: #22c55e;
    color: #000;
    border: none;
    border-radius: 12px;
    margin: 8px 0;
  }
  button.listening { background: #ef4444; color: #fff; }
  button.secondary {
    background: #374151;
    color: #fff;
    padding: 10px;
    font-size: 0.95rem;
  }
  #status {
    margin: 8px 0;
    font-size: 0.95rem;
    color: #aaa;
  }
  #meter {
    width: 100%;
    height: 20px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin: 8px 0;
  }
  #meterBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #22c55e, #eab308, #ef4444);
    transition: width 0.05s linear;
  }
  #compass {
    width: 280px;
    height: 280px;
    margin: 12px auto;
    position: relative;
    background: radial-gradient(circle, #111 0%, #000 70%);
    border: 3px solid #333;
    border-radius: 50%;
    overflow: hidden;
  }
  #compass canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #directionLabel {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 6px 0;
    color: #fbbf24;
  }
  #alert {
    display: none;
    position: fixed;
    inset: 0;
    background: #dc2626;
    color: white;
    font-size: 2.2rem;
    font-weight: 800;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 999;
    padding: 20px;
  }
  #alert.show { display: flex; }
  .instructions {
    font-size: 0.85rem;
    color: #888;
    margin: 4px 0 8px;
  }
  #history {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0;
    text-align: left;
    max-height: 280px;
    overflow-y: auto;
  }
  #history h2 {
    margin: 0 0 8px;
    font-size: 1.1rem;
    text-align: center;
  }
  .history-item {
    padding: 8px 0;
    border-bottom: 1px solid #333;
    font-size: 0.9rem;
  }
  .history-item:last-child { border-bottom: none; }
  .history-time { color: #fbbf24; font-weight: 600; }
  .history-details { color: #ccc; }
  .empty { color: #666; text-align: center; padding: 12px; }
</style>
</head>
<body>
  <h1>High Frequency Direction Finder</h1>
  <p class="instructions">Picks up high-frequency noise and slight clicks. Slowly rotate your phone to find the direction. Beeps and logs every detection.</p>

  <div class="controls">
    <label>Threshold Frequency: <span id="freqLabel">6000</span> Hz</label>
    <input type="range" id="freqThreshold" min="2000" max="20000" value="6000" step="100">

    <label>Sensitivity (lower = more sensitive to clicks): <span id="ampLabel">12</span></label>
    <input type="range" id="ampThreshold" min="3" max="200" value="12" step="1">
  </div>

  <div id="meter"><div id="meterBar"></div></div>

  <div id="compass"><canvas id="compassCanvas" width="280" height="280"></canvas></div>
  <div id="directionLabel">Rotate phone to scan</div>

  <button id="startBtn">Start Listening</button>
  <p id="status">Tap Start → allow mic + motion/orientation</p>

  <div id="history">
    <h2>Alert History</h2>
    <div id="historyList"></div>
    <button class="secondary" id="clearHistory">Clear History</button>
  </div>

  <div id="alert">⚠️ HIGH FREQUENCY / CLICK<br>DETECTED</div>

<script>
const freqSlider = document.getElementById('freqThreshold');
const ampSlider = document.getElementById('ampThreshold');
const freqLabel = document.getElementById('freqLabel');
const ampLabel = document.getElementById('ampLabel');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const alertDiv = document.getElementById('alert');
const meterBar = document.getElementById('meterBar');
const compassCanvas = document.getElementById('compassCanvas');
const directionLabel = document.getElementById('directionLabel');
const historyList = document.getElementById('historyList');
const clearHistoryBtn = document.getElementById('clearHistory');
const ctx = compassCanvas.getContext('2d');

freqSlider.oninput = () => freqLabel.textContent = freqSlider.value;
ampSlider.oninput = () => ampLabel.textContent = ampSlider.value;

let audioContext = null;
let analyser = null;
let microphone = null;
let dataArray = null;
let isListening = false;
let animationId = null;

const NUM_BINS = 72;
let directionLevels = new Array(NUM_BINS).fill(0);
let maxLevelEver = 1;
let currentHeading = 0;
let smoothedHeading = 0;
let strongestBin = -1;
let headingInitialized = false;

let lastBeepTime = 0;
const BEEP_COOLDOWN = 400;

let wasAboveThreshold = false;
let lastLogTime = 0;
const LOG_COOLDOWN = 800;

let prevMaxHigh = 0;

let alertHistory = JSON.parse(localStorage.getItem('hfAlertHistory') || '[]');

function saveHistory() {
  localStorage.setItem('hfAlertHistory', JSON.stringify(alertHistory.slice(0, 100)));
}

function renderHistory() {
  if (alertHistory.length === 0) {
    historyList.innerHTML = '<div class="empty">No alerts yet</div>';
    return;
  }
  historyList.innerHTML = alertHistory.map(item => `
    <div class="history-item">
      <div class="history-time">${item.time}</div>
      <div class="history-details">Peak: ${item.peak} | Dir: ${item.direction || 'N/A'} | Heading: ${item.heading}°</div>
    </div>
  `).join('');
}

function addAlert(peak, heading) {
  const now = Date.now();
  if (now - lastLogTime < LOG_COOLDOWN) return;
  lastLogTime = now;

  let dir = 'N/A';
  if (strongestBin >= 0) {
    const deg = binToHeading(strongestBin);
    if (deg >= 22.5 && deg < 67.5) dir = 'NE';
    else if (deg >= 67.5 && deg < 112.5) dir = 'E';
    else if (deg >= 112.5 && deg < 157.5) dir = 'SE';
    else if (deg >= 157.5 && deg < 202.5) dir = 'S';
    else if (deg >= 202.5 && deg < 247.5) dir = 'SW';
    else if (deg >= 247.5 && deg < 292.5) dir = 'W';
    else if (deg >= 292.5 && deg < 337.5) dir = 'NW';
    else dir = 'N';
  }

  const timeStr = new Date().toLocaleTimeString();
  alertHistory.unshift({ time: timeStr, peak, direction: dir, heading: Math.round(heading) });
  if (alertHistory.length > 100) alertHistory.pop();
  saveHistory();
  renderHistory();
}

clearHistoryBtn.onclick = () => {
  alertHistory = [];
  saveHistory();
  renderHistory();
};

function headingToBin(heading) {
  let h = ((heading % 360) + 360) % 360;
  return Math.floor(h / 5) % NUM_BINS;
}

function binToHeading(bin) {
  return bin * 5 + 2.5;
}

function smoothHeading(newHeading) {
  if (!headingInitialized) {
    smoothedHeading = newHeading;
    headingInitialized = true;
    return smoothedHeading;
  }
  let diff = newHeading - smoothedHeading;
  if (diff > 180) diff -= 360;
  if (diff < -180) diff += 360;
  smoothedHeading = (smoothedHeading + diff * 0.15 + 360) % 360;
  return smoothedHeading;
}

function playBeep() {
  if (!audioContext) return;
  const now = Date.now();
  if (now - lastBeepTime < BEEP_COOLDOWN) return;
  lastBeepTime = now;

  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1000, audioContext.currentTime);
  gain.gain.setValueAtTime(0.35, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.12);
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime + 0.12);
}

function drawCompass() {
  const w = compassCanvas.width;
  const h = compassCanvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const r = Math.min(cx, cy) - 10;

  ctx.clearRect(0, 0, w, h);

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < NUM_BINS; i++) {
    const level = directionLevels[i];
    const intensity = Math.min(1, level / Math.max(maxLevelEver, 1));
    if (intensity < 0.06) continue;

    const angle = (i * 5 - 90) * Math.PI / 180;
    const len = r * intensity;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
    ctx.strokeStyle = `rgba(239, 68, 68, ${0.35 + intensity * 0.65})`;
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  if (strongestBin >= 0 && maxLevelEver > 8) {
    const angle = (strongestBin * 5 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * r * 0.95, cy + Math.sin(angle) * r * 0.95);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx + Math.cos(angle) * r * 0.85, cy + Math.sin(angle) * r * 0.85, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  ctx.fillStyle = '#888';
  ctx.font = '12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - r + 18);
  ctx.fillText('E', cx + r - 18, cy + 4);
  ctx.fillText('S', cx, cy + r - 8);
  ctx.fillText('W', cx - r + 18, cy + 4);
}

function updateDirectionLabel() {
  if (strongestBin < 0 || maxLevelEver < 8) {
    directionLabel.textContent = 'Rotate phone to scan';
    return;
  }
  const deg = Math.round(binToHeading(strongestBin));
  let dir = 'N';
  if (deg >= 22.5 && deg < 67.5) dir = 'NE';
  else if (deg >= 67.5 && deg < 112.5) dir = 'E';
  else if (deg >= 112.5 && deg < 157.5) dir = 'SE';
  else if (deg >= 157.5 && deg < 202.5) dir = 'S';
  else if (deg >= 202.5 && deg < 247.5) dir = 'SW';
  else if (deg >= 247.5 && deg < 292.5) dir = 'W';
  else if (deg >= 292.5 && deg < 337.5) dir = 'NW';
  directionLabel.textContent = `Strongest: ${dir} (${deg}°)`;
}

function handleOrientation(e) {
  let raw = e.webkitCompassHeading != null ? e.webkitCompassHeading : (360 - (e.alpha || 0));
  currentHeading = smoothHeading(raw);
}

async function requestOrientationPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const response = await DeviceOrientationEvent.requestPermission();
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation);
        return true;
      }
    } catch (err) {
      console.warn('Orientation permission error', err);
    }
    return false;
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
    return true;
  }
}

async function startListening() {
  if (isListening) return;
  try {
    await requestOrientationPermission();

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: { 
        echoCancellation: false, 
        noiseSuppression: false, 
        autoGainControl: false 
      } 
    });
    microphone = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.05; // faster response for clicks
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    microphone.connect(analyser);

    directionLevels = new Array(NUM_BINS).fill(0);
    maxLevelEver = 1;
    strongestBin = -1;
    headingInitialized = false;
    lastBeepTime = 0;
    wasAboveThreshold = false;
    prevMaxHigh = 0;

    isListening = true;
    startBtn.textContent = 'Stop Listening';
    startBtn.classList.add('listening');
    statusEl.textContent = 'Listening — sensitive to clicks';
    detect();
  } catch (err) {
    statusEl.textContent = 'Error: ' + (err.message || err);
  }
}

function stopListening() {
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }
  isListening = false;
  startBtn.textContent = 'Start Listening';
  startBtn.classList.remove('listening');
  statusEl.textContent = 'Stopped';
  alertDiv.classList.remove('show');
  meterBar.style.width = '0%';
  if (animationId) cancelAnimationFrame(animationId);
  drawCompass();
}

startBtn.onclick = () => isListening ? stopListening() : startListening();

function detect() {
  if (!isListening || !analyser) return;

  analyser.getByteFrequencyData(dataArray);

  const sampleRate = audioContext.sampleRate || 48000;
  const nyquist = sampleRate / 2;
  const binCount = analyser.frequencyBinCount;
  const freqRes = nyquist / binCount;

  const thresholdFreq = parseInt(freqSlider.value, 10);
  const thresholdAmp = parseInt(ampSlider.value, 10);

  let maxHigh = 0;
  for (let i = 0; i < binCount; i++) {
    const freq = i * freqRes;
    if (freq >= thresholdFreq) {
      if (dataArray[i] > maxHigh) maxHigh = dataArray[i];
    }
  }

  const meterPercent = Math.min(100, (maxHigh / 255) * 100);
  meterBar.style.width = meterPercent + '%';

  const bin = headingToBin(currentHeading);
  directionLevels[bin] = Math.max(directionLevels[bin] * 0.8, maxHigh);
  if (maxHigh > maxLevelEver) maxLevelEver = maxHigh;

  for (let i = 0; i < NUM_BINS; i++) {
    if (i !== bin) directionLevels[i] *= 0.992;
  }

  let best = 0;
  strongestBin = 0;
  for (let i = 0; i < NUM_BINS; i++) {
    if (directionLevels[i] > best) {
      best = directionLevels[i];
      strongestBin = i;
    }
  }

  drawCompass();
  updateDirectionLabel();

  // Detect both sustained high-freq and sudden clicks (spikes)
  const spike = maxHigh - prevMaxHigh;
  const isClick = spike > (thresholdAmp * 0.6) && maxHigh > 8;
  const isAbove = maxHigh > thresholdAmp || isClick;

  if (isAbove) {
    alertDiv.classList.add('show');
    if (navigator.vibrate) navigator.vibrate(60);
    playBeep();

    if (!wasAboveThreshold || (Date.now() - lastLogTime >= LOG_COOLDOWN)) {
      addAlert(maxHigh, currentHeading);
    }
  } else {
    alertDiv.classList.remove('show');
  }

  wasAboveThreshold = isAbove;
  prevMaxHigh = maxHigh * 0.7; // slow decay of previous peak

  statusEl.textContent = `Peak: ${maxHigh} | Heading: ${Math.round(currentHeading)}°`;
  animationId = requestAnimationFrame(detect);
}

renderHistory();
drawCompass();
</script>
</body>
</html>
